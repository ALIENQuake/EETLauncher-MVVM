name: CI

on: [push]

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: checkout
        uses: actions/checkout@v1
      - name: Build DotNET472
        run: |
           cd "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\"
           .\MSBuild.exe -t:restore -p:Configuration=Release $Env:GITHUB_WORKSPACE\EETLauncher\EETLauncherMVVM.csproj
      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: my-artifact
          path: ..\EETLauncher\bin\Release\EETLauncher.exe
