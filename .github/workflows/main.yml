name: CI

on: [push]

jobs:
  a1:
    runs-on: windows-2019
    steps:
    - uses: actions/checkout@master
    - name: Setup MSBuild.exe
      uses: warrenbuckley/Setup-MSBuild@v1
    - name: Setup Nuget.exe
      uses: warrenbuckley/Setup-Nuget@v1
    - name: nuget restore
      run: nuget restore $Env:GITHUB_WORKSPACE\EETLauncher.sln
    - name: MSBuild
      run: msbuild $Env:GITHUB_WORKSPACE\EETLauncher\EETLauncherMVVM.csproj /p:Configuration=Release
    - name: GCI
      run: Get-ChildItem $Env:GITHUB_WORKSPACE -Recurse

